# Production and the Demo build the same way (PRODUCTION_PLAN 3.4, 3.5; ADR 0007).
# check:env fails the build when a deployed mode is missing core configuration,
# then migrations run, then the build. If migrate fails, the deploy fails.
#
# Only the production context migrates. Deploy previews and branch deploys run
# unmerged code and, unless configured otherwise, see the production
# DATABASE_URL, so they use db:migrate:preview: it skips (with a log line) unless
# a separate preview database is opted in with PREVIEW_DATABASE_URL.
# Details: docs/database-migrations.md.

[build]
  # The default for every context not listed below: never migrates the
  # production database.
  command = "pnpm check:env && pnpm db:migrate:preview && pnpm build"
  # Where @sveltejs/adapter-netlify writes the client assets. The server function
  # goes to .netlify/functions-internal and is picked up automatically.
  publish = "build"

[build.environment]
  NODE_VERSION = "22"

# The live site, and the Demo site's live deploy (its own Netlify site and database).
[context.production]
  command = "pnpm check:env && pnpm db:migrate && pnpm build"

[context.deploy-preview]
  command = "pnpm check:env && pnpm db:migrate:preview && pnpm build"

[context.branch-deploy]
  command = "pnpm check:env && pnpm db:migrate:preview && pnpm build"

# The Demo's nightly reset (netlify/functions/demo-reset.mts, docs/demo-site.md).
# A scheduled function: it runs only on its schedule, with no public URL. It is
# deployed on both sites and does nothing unless the site runs in demo mode.
# It applies pending migrations before reseeding, so it needs the SQL files.
[functions."demo-reset"]
  included_files = ["drizzle/**"]

# Static assets come from the CDN and never reach hooks.server.ts, so they get
# the non-CSP security headers here. Pages and endpoints get the full set
# (CSP included) from the hook.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
